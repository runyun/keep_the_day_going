<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Keep Going</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <button id="randomBtn">🎲 What Now</button>
        <button id="historyBtn">📊 History</button>
        <button id="rewardBtn">🎁 Rewards</button>
        <button id="addBtn">＋ Add</button>
    </header>

    <div id="statsBar">
        <div id="levelDisplay">🌱 Lv.1 · 0</div>
        <div id="pointsDisplay">🎁 0 pt</div>
        <div id="momentumBarWrapper">
            <div id="momentumBar"></div>
        </div>
    </div>

    <main id="activityContainer"></main>

    <div id="modal" class="hidden">
        <div class="modal-box">
            <h2>Add</h2>
            <input id="activityName" placeholder="Name">
            <button id="createBtn">Create</button>
            <button id="cancelBtn">Cancel</button>
        </div>
    </div>

    <div id="detailModal" class="hidden">
        <div class="modal-box">
            <h2 id="detailTitle"></h2>
            <div id="historyList"></div>
            <button id="deleteTodayBtn">Delete Today</button>
            <button id="deleteActivityBtn">Delete Activity</button>
            <button id="closeDetailBtn">Close</button>
        </div>
    </div>

    <div id="randomModal" class="hidden">
        <div class="random-box">
            <h2>🎲 What Now?</h2>

            <div id="randomName">Ready</div>
            <div id="randomResult" class="hidden"></div>

            <div class="random-buttons">
                <button id="spinBtn">Spin</button>
                <button id="closeRandomBtn">Close</button>
            </div>

        </div>
    </div>

    <div id="historyModal" class="hidden">
        <div class="history-box">
            <h2>📊 Activity History</h2>
            <div id="heatmapContainer"></div>
            <button id="closeHistoryBtn">Close</button>
        </div>
    </div>

    <div id="rewardModal" class="hidden">
        <div class="modal-box">
            <h2>🎁 Reward Shop</h2>
            <div id="rewardWeeklyInfo"></div>
            <div id="rewardList"></div>
            <div class="reward-add-form">
                <input id="rewardName" placeholder="Reward name">
                <input id="rewardCost" type="number" min="1" placeholder="pt">
                <button id="addRewardBtn">Add</button>
            </div>
            <div class="reward-stats" id="rewardLifetimeStats"></div>
            <button id="closeRewardBtn">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
