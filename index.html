<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- STICKY TOP AREA -->
  <div id="stickyTop">
    <div id="headerRow">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div id="menuDropdown" class="dropdown hidden">
        <button data-action="add">＋ Add</button>
        <button data-action="history">📊 History</button>
        <button data-action="rewards">🎁 Rewards</button>
        <button data-action="rules">📌 Rules</button>
        <button data-action="reset" style="color:#e53935;">🗑 Reset All Data</button>
      </div>
      <button id="whatNowBtn" class="pill-btn">🎲 What Now</button>
    </div>

    <div id="rulesTip" class="rules-tip">
      <span id="rulesTipText">📌 No rules yet — add one!</span>
      <span class="chevron">▾</span>
    </div>

    <div id="statsBar">
      <div class="stat-row">
        <span class="stat-icon">🌱</span>
        <span class="stat-label">Lv.<span id="levelNum">1</span></span>
        <div class="bar-track"><div id="xpFill" class="bar-fill xp-fill"></div></div>
        <span id="xpText" class="stat-text">0/70</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">⚡</span>
        <span class="stat-label">Momentum</span>
        <div class="bar-track"><div id="momentumFill" class="bar-fill momentum-fill"></div></div>
        <span id="momentumText" class="stat-text">0%</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">🎁</span>
        <span id="pointsText" class="stat-text">0pt</span>
      </div>
    </div>

    <div id="unscheduledSection">
      <div class="section-label">Unscheduled</div>
      <div id="unscheduledList"></div>
    </div>
  </div>

  <!-- SCROLLABLE TIMELINE -->
  <div id="timelineContainer">
    <div id="timeline"></div>
  </div>

</div>

<!-- ================= MODALS ================= -->

<!-- Add Activity -->
<div id="addModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header"><span>Add Activity</span><button class="close-btn" data-close="addModal">✕</button></div>
    <div class="modal-body">
      <label>Name</label>
      <input type="text" id="addName" placeholder="e.g. Morning Run">
      <label>Memo (optional)</label>
      <input type="text" id="addMemo" placeholder="e.g. 5km jog around the park">
      <label>Start time (optional)</label>
      <input type="time" id="addTime">
      <label>Duration (min)</label>
      <input type="number" id="addDuration" value="30" min="5" step="5">
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="addModal">Cancel</button>
      <button class="btn-primary" id="addConfirmBtn">Create</button>
    </div>
  </div>
</div>

<!-- Detail -->
<div id="detailModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <span id="detailName">Activity</span>
      <div class="header-actions">
        <button id="detailMoreBtn" class="icon-btn">⋯</button>
        <button class="close-btn" data-close="detailModal">✕</button>
      </div>
      <div id="detailMoreMenu" class="dropdown hidden" style="right:40px;left:auto;top:44px;">
        <button id="deleteTodayBtn">Delete Today</button>
        <button id="deleteActivityBtn">Delete Activity</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="detailStreak" class="streak-text">🔥 0 day streak</div>

      <button id="completeBtn" class="btn-primary full-width">✓ Mark Complete</button>
      <div id="starPicker" class="star-picker hidden">
        <div class="section-label">How hard was it?</div>
        <div class="star-options">
          <button class="star-opt" data-stars="1">⭐</button>
          <button class="star-opt" data-stars="2">⭐⭐</button>
          <button class="star-opt" data-stars="3">⭐⭐⭐</button>
        </div>
      </div>

      <div class="edit-schedule">
        <div class="section-label">Schedule</div>
        <label>Start time (optional)</label>
        <input type="time" id="editTime">
        <label>Duration (min)</label>
        <input type="number" id="editDuration" min="5" step="5">
        <button id="saveScheduleBtn" class="btn-secondary full-width">Save Schedule</button>
      </div>

      <div class="section-label">History</div>
      <div id="detailHistory" class="history-list"></div>
    </div>
  </div>
</div>

<!-- History -->
<div id="historyModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header"><span>📊 History</span><button class="close-btn" data-close="historyModal">✕</button></div>
    <div class="modal-body"><div id="historyList" class="history-list"></div></div>
  </div>
</div>

<!-- Rewards -->
<div id="rewardsModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header"><span>🎁 Rewards</span><button class="close-btn" data-close="rewardsModal">✕</button></div>
    <div class="modal-body">
      <div id="rewardsSummary" class="rewards-summary"></div>
      <div class="section-label">Redeem a reward</div>
      <input type="text" id="rewardName" placeholder="Reward name e.g. Watch a movie">
      <input type="number" id="rewardCost" placeholder="Cost (pt)" min="1">
      <button id="redeemBtn" class="btn-primary full-width">Redeem</button>
      <div class="section-label">Redemption History</div>
      <div id="redeemHistory" class="history-list"></div>
    </div>
  </div>
</div>

<!-- Rules Board -->
<div id="rulesModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header"><span>📌 My Rules</span><button class="close-btn" data-close="rulesModal">✕</button></div>
    <div class="modal-body corkboard">
      <div id="rulesBoard" class="rules-board"></div>
      <div class="add-rule-row">
        <input type="text" id="newRuleInput" placeholder="+ Add new rule...">
        <button id="addRuleBtn" class="btn-primary">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- What Now -->
<div id="whatNowModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header"><span>🎲 What Now?</span><button class="close-btn" data-close="whatNowModal">✕</button></div>
    <div class="modal-body">
      <div id="whatNowCard" class="what-now-card"></div>
      <div class="modal-footer-inline">
        <button id="shuffleBtn" class="btn-secondary">🔀 Shuffle</button>
        <button id="doItBtn" class="btn-primary">Do it</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
